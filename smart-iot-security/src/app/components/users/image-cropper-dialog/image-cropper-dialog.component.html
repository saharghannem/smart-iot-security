<h2 mat-dialog-title>Ajuster la photo de profil</h2>
<mat-dialog-content>
  <div class="crop-container" style="position: relative; width: 400px; height: 400px; overflow: hidden; border-radius: 8px; cursor: move; border: 1px solid #3b82f6;">
    <canvas #canvas width="400" height="400" style="display: block; width: 100%; height: 100%; object-fit: contain; cursor: grab;"></canvas>
  </div>
  
  <div class="controls" style="margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">
    <mat-icon color="primary">zoom_out</mat-icon>
    <input type="range" 
           min="0.1" 
           max="4" 
           step="0.05" 
           [value]="scale" 
           (input)="onZoomChange($event)"
           style="width: 250px;">
    <mat-icon color="primary">zoom_in</mat-icon>
  </div>
  <p style="text-align: center; color: #94a3b8; font-size: 13px; margin-top: 8px; margin-bottom: 0;">
    Glissez la photo pour la centrer dans le cercle.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">ANNULER</button>
  <button mat-flat-button color="primary" (click)="crop()">VALIDER</button>
</mat-dialog-actions>
